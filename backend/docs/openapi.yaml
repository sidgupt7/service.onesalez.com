components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  requestBodies:
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - password
              - realm
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                description: Exact password; at most 72 UTF-8 bytes. Login does not impose the current minimum
                  creation length.
              realm:
                type: string
                enum:
                  - client
                  - employee
  parameters:
    Pagination:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
  schemas:
    Success:
      type: object
      required:
        - success
        - data
        - error
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data: {}
        error:
          type: "null"
        timestamp:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        success:
          type: boolean
          const: false
        data:
          type: "null"
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        timestamp:
          type: string
          format: date-time
  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Validation:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
